<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Véhicule utilitaire léger 20 m³ de HBAS TRANSPORT, vue de profil">
  <defs>
    <linearGradient id="vl-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F8FC"/><stop offset="100%" stop-color="#FDFBF7"/>
    </linearGradient>
    <linearGradient id="vl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EEF1F5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vl-bg)"/>
  <g stroke="#E6EBF0" stroke-width="2" opacity=".8">
    <path d="M0 120 H800"/><path d="M0 200 H800"/>
  </g>

  <!-- shadow -->
  <ellipse cx="400" cy="366" rx="290" ry="16" fill="#6C7784" opacity=".18"/>

  <!-- box body -->
  <path d="M300 122 H676 a10 10 0 0 1 10 10 V330 H300 Z" fill="url(#vl-body)" stroke="#DBE1E8" stroke-width="3"/>
  <!-- cab -->
  <path d="M154 214 C154 190 168 176 196 170 L262 158 L300 122 V330 H154 Z" fill="url(#vl-body)" stroke="#DBE1E8" stroke-width="3"/>
  <!-- windscreen + door window -->
  <path d="M212 176 L292 138 V196 H196 C196 186 200 180 212 176 Z" fill="#A9CBEA"/>
  <path d="M212 176 L292 138" stroke="#FFFFFF" stroke-width="4" opacity=".7"/>
  <!-- accent stripe -->
  <rect x="154" y="268" width="532" height="20" fill="#FF5B12"/>
  <!-- rear doors seam -->
  <path d="M492 122 V330" stroke="#DBE1E8" stroke-width="3"/>
  <path d="M676 132 V330" stroke="#D2D9E1" stroke-width="2"/>
  <!-- wordmark -->
  <text x="330" y="200" font-family="Archivo, Arial Narrow, sans-serif" font-size="46" font-weight="800" letter-spacing="4" fill="#12171F" opacity=".82">HBAS</text>
  <text x="330" y="232" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="5" fill="#5A6672">TRANSPORT</text>
  <!-- door handle, mirror, bumper -->
  <rect x="238" y="230" width="30" height="7" rx="3.5" fill="#B9C2CC"/>
  <path d="M158 186 h-18 a6 6 0 0 0-6 6 v20 a6 6 0 0 0 6 6 h18" fill="#2B3540"/>
  <rect x="150" y="322" width="60" height="16" rx="4" fill="#39424C"/>
  <rect x="600" y="322" width="86" height="16" rx="4" fill="#39424C"/>
  <!-- lights -->
  <rect x="152" y="296" width="22" height="14" rx="4" fill="#FFD48A"/>
  <rect x="666" y="296" width="20" height="14" rx="4" fill="#E4483C"/>

  <!-- wheels -->
  <g>
    <circle cx="228" cy="330" r="46" fill="#232C36"/><circle cx="228" cy="330" r="22" fill="#9AA4AF"/><circle cx="228" cy="330" r="9" fill="#6C7784"/>
    <circle cx="592" cy="330" r="46" fill="#232C36"/><circle cx="592" cy="330" r="22" fill="#9AA4AF"/><circle cx="592" cy="330" r="9" fill="#6C7784"/>
  </g>
  <!-- wheel arches -->
  <path d="M182 330 a46 46 0 0 1 92 0" fill="none" stroke="#CBD3DB" stroke-width="4"/>
  <path d="M546 330 a46 46 0 0 1 92 0" fill="none" stroke="#CBD3DB" stroke-width="4"/>

  <!-- ground -->
  <path d="M60 376 H740" stroke="#DDE3EA" stroke-width="4" stroke-linecap="round"/>
</svg>
