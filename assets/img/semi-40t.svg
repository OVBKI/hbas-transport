<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Semi-remorque 3 essieux MMA 40 tonnes de HBAS TRANSPORT, vue de profil">
  <defs>
    <linearGradient id="sm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F8FC"/><stop offset="100%" stop-color="#FDFBF7"/>
    </linearGradient>
    <linearGradient id="sm-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EBEFF4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sm-bg)"/>
  <g stroke="#E6EBF0" stroke-width="2" opacity=".8">
    <path d="M0 100 H800"/><path d="M0 180 H800"/>
  </g>

  <ellipse cx="410" cy="374" rx="340" ry="16" fill="#6C7784" opacity=".18"/>

  <!-- trailer -->
  <path d="M242 96 H716 a10 10 0 0 1 10 10 V300 H242 Z" fill="url(#sm-body)" stroke="#DBE1E8" stroke-width="3"/>
  <!-- tautliner curtain folds -->
  <g stroke="#E1E7ED" stroke-width="2.5">
    <path d="M330 96 V300"/><path d="M408 96 V300"/><path d="M486 96 V300"/><path d="M564 96 V300"/><path d="M642 96 V300"/>
  </g>
  <rect x="242" y="96" width="484" height="12" fill="#DCE2E9"/>
  <!-- accent stripe -->
  <rect x="242" y="248" width="484" height="24" fill="#FF5B12"/>
  <!-- wordmark -->
  <text x="286" y="176" font-family="Archivo, Arial Narrow, sans-serif" font-size="58" font-weight="800" letter-spacing="6" fill="#12171F" opacity=".85">HBAS</text>
  <text x="290" y="214" font-family="ui-monospace, Menlo, monospace" font-size="19" letter-spacing="7" fill="#5A6672">TRANSPORT</text>

  <!-- tractor unit cab -->
  <path d="M62 140 a16 16 0 0 1 16-16 H196 a12 12 0 0 1 12 12 V296 H62 Z" fill="url(#sm-body)" stroke="#DBE1E8" stroke-width="3"/>
  <path d="M78 150 a8 8 0 0 1 8-8 H196 V214 H78 Z" fill="#A9CBEA"/>
  <path d="M78 186 H196" stroke="#FFFFFF" stroke-width="3" opacity=".55"/>
  <rect x="62" y="240" width="146" height="20" fill="#FF5B12"/>
  <!-- chassis + fifth wheel -->
  <rect x="196" y="286" width="120" height="14" fill="#39424C"/>
  <rect x="242" y="300" width="484" height="10" fill="#3A434D"/>
  <!-- landing legs -->
  <rect x="352" y="310" width="12" height="44" fill="#4A545F"/><rect x="386" y="310" width="12" height="44" fill="#4A545F"/>
  <!-- side guards -->
  <path d="M430 320 H700" stroke="#B9C2CC" stroke-width="7" stroke-linecap="round"/>
  <!-- mirror, bumper, lights -->
  <path d="M66 132 h-20 a6 6 0 0 0-6 6 v28 a6 6 0 0 0 6 6 h20" fill="#2B3540"/>
  <rect x="54" y="284" width="72" height="18" rx="5" fill="#39424C"/>
  <rect x="58" y="256" width="26" height="16" rx="4" fill="#FFD48A"/>
  <rect x="716" y="272" width="16" height="18" rx="4" fill="#E4483C"/>
  <!-- exhaust -->
  <rect x="208" y="176" width="12" height="112" rx="4" fill="#8A949E"/>

  <!-- wheels: tractor 2 + trailer 3 -->
  <g>
    <circle cx="126" cy="318" r="50" fill="#232C36"/><circle cx="126" cy="318" r="24" fill="#9AA4AF"/><circle cx="126" cy="318" r="10" fill="#6C7784"/>
    <circle cx="286" cy="318" r="50" fill="#232C36"/><circle cx="286" cy="318" r="24" fill="#9AA4AF"/><circle cx="286" cy="318" r="10" fill="#6C7784"/>
    <circle cx="536" cy="318" r="50" fill="#232C36"/><circle cx="536" cy="318" r="24" fill="#9AA4AF"/><circle cx="536" cy="318" r="10" fill="#6C7784"/>
    <circle cx="622" cy="318" r="50" fill="#232C36"/><circle cx="622" cy="318" r="24" fill="#9AA4AF"/><circle cx="622" cy="318" r="10" fill="#6C7784"/>
    <circle cx="708" cy="318" r="50" fill="#232C36"/><circle cx="708" cy="318" r="24" fill="#9AA4AF"/><circle cx="708" cy="318" r="10" fill="#6C7784"/>
  </g>
  <g fill="none" stroke="#CBD3DB" stroke-width="4">
    <path d="M76 318 a50 50 0 0 1 100 0"/><path d="M236 318 a50 50 0 0 1 100 0"/>
    <path d="M486 318 a50 50 0 0 1 100 0"/><path d="M572 318 a50 50 0 0 1 100 0"/><path d="M658 318 a50 50 0 0 1 100 0"/>
  </g>

  <path d="M30 384 H770" stroke="#DDE3EA" stroke-width="4" stroke-linecap="round"/>
</svg>
