<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Gabarit de l'image de partage — HBAS TRANSPORT</title>
<!--
  Gabarit servant à générer assets/img/og-image.png (1200 × 630).
  Mise en page HTML plutôt que SVG à coordonnées fixes : le texte se
  dimensionne seul, donc la largeur réelle des polices ne peut plus
  faire déborder le titre.
  Régénération : voir assets/og/README.md
-->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root {
    --deep: #050608; --bg: #0A0B0E;
    --txt: #F1F3F7; --txt-2: #AAB3C0; --line: #272C36;
    --red: #E23434;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font-family: "Instrument Sans", sans-serif;
    color: var(--txt);
    background:
      radial-gradient(52% 90% at 82% 52%, rgba(226,52,52,.26) 0%, rgba(226,52,52,0) 62%),
      linear-gradient(135deg, #0A0B0E, #14101A);
  }

  /* bandeaux de chevrons */
  .band {
    height: 26px; flex: none;
    background: repeating-linear-gradient(115deg, var(--red) 0 22px, var(--deep) 22px 44px);
  }

  .body { flex: 1; display: flex; align-items: center; gap: 40px; padding: 0 80px; }
  .left { flex: 1 1 auto; min-width: 0; }

  .mark {
    width: 84px; height: 84px; border-radius: 20px; margin-bottom: 34px;
    background: linear-gradient(135deg, #FF6A50, #E23434 55%, #B01818);
    display: grid; place-items: center;
  }
  .mark svg { width: 52px; height: 52px; }

  h1 {
    font-family: "Archivo", sans-serif;
    font-weight: 800; font-stretch: 112%;
    font-size: 82px; line-height: .96; letter-spacing: -.02em;
    background: linear-gradient(96deg, #FF9E80 0%, #F4463F 46%, #FF6A50 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    padding-bottom: .04em;
  }
  .sub { font-size: 30px; line-height: 1.35; color: var(--txt-2); margin-top: 20px; max-width: 20ch; }

  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .pill {
    font-family: "Martian Mono", monospace;
    font-size: 16px; letter-spacing: .1em;
    padding: 12px 20px; border: 2px solid var(--line); border-radius: 100px;
    white-space: nowrap;
  }

  /* camion, vu de profil */
  .rig { flex: none; width: 400px; opacity: .95; }
</style>
</head>
<body>
  <div class="band"></div>

  <div class="body">
    <div class="left">
      <div class="mark">
        <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#0A0B0E">
          <path d="M14 18 L26 32 L14 46 L22 46 L34 32 L22 18 Z"/>
          <path d="M30 18 L42 32 L30 46 L38 46 L50 32 L38 18 Z"/>
        </g></svg>
      </div>

      <h1>HBAS TRANSPORT</h1>
      <p class="sub">Votre partenaire de confiance pour le transport national et international.</p>

      <div class="pills">
        <span class="pill">BELGIQUE · EU</span>
        <span class="pill">DEVIS GRATUIT</span>
        <span class="pill">FTL · LTL · EXPRESS</span>
      </div>
    </div>

    <svg class="rig" viewBox="0 0 500 200" aria-hidden="true">
      <rect x="120" y="20" width="360" height="150" rx="8" fill="#1B1F27" stroke="#2E343F" stroke-width="4"/>
      <rect x="120" y="132" width="360" height="16" fill="#E23434"/>
      <path d="M20 66 a12 12 0 0 1 12-12 H112 V170 H20 Z" fill="#1B1F27" stroke="#2E343F" stroke-width="4"/>
      <path d="M32 72 H112 V116 H32 Z" fill="#2B3648"/>
      <rect x="20" y="148" width="460" height="12" fill="#22272F"/>
      <g fill="#0C0F15"><circle cx="70" cy="180" r="24"/><circle cx="330" cy="180" r="24"/><circle cx="404" cy="180" r="24"/></g>
      <g fill="#333B49"><circle cx="70" cy="180" r="10"/><circle cx="330" cy="180" r="10"/><circle cx="404" cy="180" r="10"/></g>
      <rect x="24" y="118" width="20" height="12" rx="4" fill="#FFD48A"/>
    </svg>
  </div>

  <div class="band"></div>
</body>
</html>
